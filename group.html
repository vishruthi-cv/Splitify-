<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitify- Simply split itt</title>
    <link rel="stylesheet" href="group.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <h1> <a href="homepage.html">Splitify </a></h1>
    </header>
    <div class="fading-line"></div>


    <button id="newTripBtn" class="sign">New Trip</button>

    <main>
        <div class="wrapper">

            <div class="container2">

                <h1> Create group:</h1>

                <div class="groupName">
                    Enter group name: <br>
                    <input type="text" class=" textbox TripName" placeholder="Trip to Indore">
                    <button id="saveTripBtn" class="sign">Set Name</button>
                </div>
                <div class="names">
                    Enter names: <br>
                    <input type="text" class="textbox nameInput " placeholder="Enter name">
                    <button id="addNameBtn" class="sign">Add Person</button>
                    <ul class="nameListPreview"></ul>
                </div>

            </div>
        </div>



        <a class="sign go" href="doc.html"> Go!</a>

    </main>

    <div class="fading-line"></div>


</body>




<script src="script.js"></script>

</html>
